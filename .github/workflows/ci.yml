name: ci

on:
  push:
    branches: ['**']   # tags are covered by release.yml
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - run: test/lint.sh

  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [debian:stable-slim, ubuntu:24.04]
    steps:
      # A full clone: the test clones the checkout inside the container and
      # runs ask-version against it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: test/docker-install.sh "${{ matrix.image }}"
